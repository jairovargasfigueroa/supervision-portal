# 601: lint, pruebas y compilación en cada PR; en push a main (release), la carpeta compilada como artefacto.
# Se compila una vez y sin .env: las direcciones se escriben al publicar (configuracion.json).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Compilación (tipos y Vite)
        run: npm run build

  archivos:
    needs: prueba
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilación
        run: npm run build
      - name: Carpeta compilada y plantilla como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: portal-${{ github.sha }}
          path: |
            dist
            configuracion.json.plantilla
          if-no-files-found: error
          retention-days: 90
